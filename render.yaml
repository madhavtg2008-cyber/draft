# Render blueprint — creates the LexDraft web service with a permanent disk for its data.
# Render dashboard → New → Blueprint → pick this GitHub repo. It will ask for the values marked "sync: false".
services:
  - type: web
    name: lexdraft
    runtime: node
    plan: starter            # always on; a disk needs a paid plan (Free instances sleep and lose data)
    region: singapore        # closest Render region to India
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: lexdraft-data
      mountPath: /var/data
      sizeGB: 1              # matters, drafts and history live here and survive restarts
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.13.0"
      - key: DB_PATH
        value: /var/data/lexdraft.db
      - key: OUTBOX_DIR
        value: /var/data/outbox
      - key: HEAD_NAME       # the Team Head account, created on first start
        sync: false
      - key: HEAD_EMAIL
        sync: false
      - key: HEAD_PASSWORD   # 8+ characters; you can change it later by resetting the disk or adding a reset flow
        sync: false
      - key: PUBLIC_URL      # your domain, e.g. https://www.yourfirm.com — used in emailed links
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Optional — real email sending (otherwise emails are saved in /var/data/outbox):
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
